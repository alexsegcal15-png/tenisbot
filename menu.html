<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TenisBot - Análisis</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>🎾 TenisBot - Análisis de Jugadoras</h1>
        <button id="logoutBtn" class="btn-logout">Cerrar sesión</button>
    </header>

    <main class="main-container">
        <section class="filters-section">
            <h2>Filtros de búsqueda</h2>
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="dateFilter">📅 Fecha:</label>
                    <input type="date" id="dateFilter">
                </div>
                <div class="filter-group">
                    <label for="tournamentFilter">🏆 Torneo:</label>
                    <input type="text" id="tournamentFilter" placeholder="Nombre del torneo...">
                </div>
                <div class="filter-group">
                    <label for="lossPercentage">% Mínimo pérdidas:</label>
                    <input type="number" id="lossPercentage" value="80" min="50" max="100">
                </div>
                <div class="filter-group">
                    <label>Fuentes:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" value="itf" checked> ITFTennis.com</label>
                        <label><input type="checkbox" value="core" checked> CoreTennis.net</label>
                        <label><input type="checkbox" value="explorer" checked> TennisExplorer.com</label>
                    </div>
                </div>
            </div>
            <button id="checkBtn" class="btn-check">🔍 Check - Buscar Jugadoras</button>
        </section>

        <section class="results-section" id="resultsSection" style="display:none;">
            <h2>Resultados de la búsqueda</h2>
            <div id="loadingIndicator" class="loading" style="display:none;">
                <div class="spinner"></div>
                <p>Buscando jugadoras...</p>
            </div>
            <div id="resultsContainer"></div>
        </section>
    </main>

    <footer>
        <p>TenisBot v1.0 | Analizando: ITF, CoreTennis, TennisExplorer</p>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/scraper.js"></script>
</body>
</html>
